name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        if: runner.os == 'Linux'
        run: uv run ruff format --check untrace/ tests/ scripts/ && uv run ruff check untrace/ tests/ scripts/

      - name: Unit tests
        run: uv run pytest --ignore=tests/test_chromedriver.py -q

  build:
    name: Build (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk \
            tcl-dev \
            tk-dev \
            libx11-dev \
            libxext-dev \
            dpkg

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y

      - name: Resolve version
        id: ver
        shell: bash
        run: echo "version=$(uv run python -c 'from untrace import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build
        run: uv run python -m untrace --build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: untrace-${{ matrix.name }}-v${{ steps.ver.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
