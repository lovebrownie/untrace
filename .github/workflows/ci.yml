name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.name }})
    if: github.event_name == 'push' || github.head_ref != 'dev'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        if: runner.os == 'Linux'
        run: uv run ruff format --check untrace/ tests/ scripts/ && uv run ruff check untrace/ tests/ scripts/

      - name: Unit tests
        run: uv run pytest --ignore=tests/test_chromedriver.py -q
