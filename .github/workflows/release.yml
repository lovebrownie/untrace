name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: read

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  gate:
    name: Check for new release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
      bump_sha: ${{ steps.check.outputs.bump_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Resolve version
        id: check
        shell: bash
        run: |
          ver=$(uv run python -c 'from untrace import __version__; print(__version__)')
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/v${ver}" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${ver} already exists; skipping release."
            {
              echo "## Release gate"
              echo ""
              echo "**Release skipped.** Tag \`v${ver}\` already exists on the remote."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            log=$(git log -30 --format='%H %s' "$after")
          elif git rev-parse --verify "${before}^{commit}" >/dev/null 2>&1 \
            && git merge-base --is-ancestor "$before" "$after" 2>/dev/null; then
            log=$(git log "${before}..${after}" --format='%H %s')
          else
            echo "Push before (${before}) is missing or not an ancestor of ${after}; scanning recent commits."
            log=$(git log -30 --format='%H %s' "$after")
          fi

          if git rev-parse "${after}^2" >/dev/null 2>&1; then
            merge_log=$(
              git log --format='%H %s' "${after}^2" --not "${after}^1" 2>/dev/null | head -50
            )
            if [ -n "$merge_log" ]; then
              log=$(printf '%s\n%s' "$merge_log" "$log")
            else
              log=$(printf '%s\n%s' "$(git log -1 --format='%H %s' "${after}^2")" "$log")
            fi
          fi

          bump_ver_from_subject() {
            local subject="$1"
            local rest=""
            case "$subject" in
              Bump\ to\ version\ \"*)
                rest="${subject#Bump to version \"}"
                rest="${rest%\"}"
                ;;
              Bump\ to\ version\ *)
                rest="${subject#Bump to version }"
                ;;
              chore:\ bump\ version\ to\ *)
                rest="${subject#chore: bump version to }"
                ;;
              *)
                return 1
                ;;
            esac
            if [[ "$rest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "$rest"
              return 0
            fi
            return 1
          }

          find_bump_in_log() {
            local scan="$1"
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              local sha="${line%% *}"
              local subject="${line#${sha} }"
              local msg_ver
              msg_ver=$(bump_ver_from_subject "$subject") || continue
              if [ "$msg_ver" = "$ver" ]; then
                bump_sha="$sha"
                echo "Found bump commit: ${subject} (${sha})"
                return 0
              fi
            done <<< "$scan"
            return 1
          }

          found=false
          bump_sha=""
          skip_reason=""
          if find_bump_in_log "$log"; then
            found=true
          elif find_bump_in_log "$(git log -50 --format='%H %s' "$after")"; then
            found=true
            echo "Bump commit found on ${after} history (not only in this push range)."
          fi

          if [ "$found" = true ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "bump_sha=${bump_sha}" >> "$GITHUB_OUTPUT"
            echo "New version v${ver}; proceeding with release."
            {
              echo "## Release gate"
              echo ""
              echo "Publishing **v${ver}** (bump commit \`${bump_sha}\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            skip_reason="No bump commit for version ${ver} in this push."
            echo "${skip_reason}"
            echo "Expected a commit like chore: bump version to ${ver}."
            {
              echo "## Release gate"
              echo ""
              echo "**Release skipped.** ${skip_reason}"
              echo ""
              echo "Pyproject version is **${ver}**. Run \`./bumpversion.sh patch\` (or minor/major), push, then merge to main. Expected: \`chore: bump version to ${ver}\` (legacy \`Bump to version \"${ver}\"\` also works)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: Publish GitHub Release
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find CI workflow run
        id: ci_run
        uses: actions/github-script@v7
        with:
          script: |
            const bumpSha = "${{ needs.gate.outputs.bump_sha }}";
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yml",
              head_sha: bumpSha,
              event: "push",
              per_page: 10,
            });
            const run = data.workflow_runs.find(
              (item) => item.status === "completed" && item.conclusion === "success"
            );
            if (!run) {
              core.setFailed(
                `No successful CI build found for bump commit ${bumpSha}. Push the branch before merging to main.`
              );
              return;
            }
            core.info(`Using CI run ${run.id} from ${bumpSha}`);
            core.setOutput("run_id", String(run.id));

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.ci_run.outputs.run_id }}
          pattern: untrace-*-v${{ needs.gate.outputs.version }}
          merge-multiple: true
          path: dist

      - name: Verify artifacts
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No dist artifacts downloaded from CI run."
            exit 1
          fi
          for file in dist/*Windows.zip dist/*-Portable.exe; do
            if [ -e "$file" ]; then
              echo "Unexpected release artifact: $file"
              exit 1
            fi
          done
          ls -la dist/

      - name: Write release notes
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        shell: bash
        run: |
          tag="v${VERSION}"
          base="https://github.com/${{ github.repository }}/releases/download/${tag}"
          {
            echo "# Untrace ${tag}"
            echo
            echo "## Downloads"
            echo
            for file in dist/*; do
              name=$(basename "$file")
              echo "- [${name}](${base}/${name})"
            done
          } > release-notes.md
          cat release-notes.md

      - name: Create and push tag
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.gate.outputs.version }}
          name: Untrace v${{ needs.gate.outputs.version }}
          body_path: release-notes.md
          files: dist/*
