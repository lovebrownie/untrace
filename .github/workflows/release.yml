name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tagged commit is on main
        id: check
        shell: bash
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${GITHUB_REF_NAME} is on main; proceeding with release."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${GITHUB_REF_NAME} is not on main; skipping release."
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Verify tag matches pyproject version
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ver=$(uv run python -c 'from untrace import __version__; print(__version__)')
          tag="${GITHUB_REF_NAME#v}"
          test "$ver" = "$tag"

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk \
            tcl-dev \
            tk-dev \
            libx11-dev \
            libxext-dev \
            dpkg

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y

      - name: Build
        run: uv run python -m untrace --build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [gate, build]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Resolve version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Untrace v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: dist/*
