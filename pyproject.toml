[project]
name = "untrace"
version = "2.0.2"
description = "With Untrace, you don't need to worry about configs to make your bot undetectable"
readme = "README.md"
requires-python = ">=3.14,<4.0"
license = "MIT"
authors = [
    { name = "lovebrownie", email = "91576261+lovebrownie@users.noreply.github.com" },
]
keywords = ["chrome", "selenium", "stealth", "automation"]
dependencies = [
    "undetected",
]

[project.scripts]
untrace = "untrace.__main__:main"

[dependency-groups]
dev = [
    "ruff (>=0.14.0,<0.15.0)",
    "selenium (>=4.45.0,<5.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pyinstaller (>=6.21.0,<7.0.0) ; python_version >= \"3.14\" and python_version < \"3.16\"",
    "taskipy>=1.14.1",
]

[tool.uv.sources]
undetected = { git = "https://github.com/lovebrownie/undetected" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["untrace"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["untrace", "undetected"]

[tool.taskipy.tasks]
lint = "ruff format untrace/ tests/ scripts/ && ruff check --fix untrace/ tests/ scripts/"
lint-check = "ruff format --check untrace/ tests/ scripts/ && ruff check untrace/ tests/ scripts/"
test = "pytest --ignore=tests/test_chromedriver.py"
test-browser = "pytest tests/test_chromedriver.py"
gui = "python -m untrace --gui"
install = "python -m untrace --install --stealth-extension --launch-wrapper --chromedriver-cdc"
uninstall = "python -m untrace --uninstall"
status = "python -m untrace --status"
build = "python -m untrace --build"
build-gui = "python scripts/build_gui.py"
pack-extension = "python -m untrace --pack-extension"
