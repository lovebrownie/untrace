[project]
name = "untrace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = ["taskipy (>=1.14.1,<2.0.0)"]

[dependency-groups]
dev = [
    "ruff (>=0.14.0,<0.15.0)",
    "selenium (>=4.45.0,<5.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pyinstaller (>=6.21.0,<7.0.0) ; python_version >= \"3.14\" and python_version < \"3.16\"",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["untrace"]

[tool.taskipy.tasks]
lint = { cmd = "ruff format untrace/ tests/ && ruff check --fix untrace/ tests/", help = "Format and lint with Ruff" }
lint-check = { cmd = "ruff format --check untrace/ tests/ && ruff check untrace/ tests/", help = "Verify formatting and lint without fixing" }
gui = { cmd = "python -m untrace --gui", help = "Open the Windows install/uninstall GUI" }
build-gui = { cmd = "pyinstaller --noconfirm --clean --windowed --onefile --uac-admin --name Untrace --paths . --collect-all untrace --distpath dist --workpath build/pyinstaller --specpath build/pyinstaller untrace/gui_windows.py", help = "Build Untrace.exe with PyInstaller (Windows)" }
