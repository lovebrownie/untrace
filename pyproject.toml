[project]
name = "untrace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = ["taskipy (>=1.14.1,<2.0.0)"]

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "selenium (>=4.45.0,<5.0.0)",
    "pytest (>=9.1.1,<10.0.0)"
]

[tool.taskipy.tasks]
lint = { cmd = "black untrace/ --target-version py314 && isort untrace/", help = "Run linting tools" }
